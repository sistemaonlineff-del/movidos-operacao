<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Movidos Transportes - Demonstração</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fbfb;color:#0b1720;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#101820;color:#fff;padding:1.5rem 1rem;display:flex;flex-direction:column;border-right:4px solid #10b9b6}.brand{display:flex;gap:.7rem;align-items:center;font-weight:850;letter-spacing:.08em;padding:.2rem .5rem 2.2rem;color:#10b9b6}.brand b{width:34px;height:34px;display:grid;place-items:center;background:#10b9b6;color:#fff;border-radius:10px}nav{display:grid;gap:.35rem}nav button{border:0;background:none;padding:.75rem 1rem;border-radius:10px;color:#c7d2d8;text-align:left;font:700 .9rem inherit;cursor:pointer}nav button:hover,nav button.active{background:#10b9b6;color:#fff}.sub{display:grid;gap:.15rem;margin:-.1rem 0 .25rem .7rem;padding-left:.55rem;border-left:1px solid #4d6977}.sub button{font-size:.8rem;padding:.5rem .7rem}.side-bottom{margin-top:auto;border-top:1px solid #33424d;padding:1rem .5rem;color:#b7c5cb;font-size:.82rem}.content{padding:2rem clamp(1.2rem,4vw,4rem);max-width:1500px;width:100%;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}.eyebrow{font-size:.72rem;letter-spacing:.15em;font-weight:800;color:#069f9d;margin:0 0 .55rem}h1{font-size:2rem;letter-spacing:-.05em;margin:0}.user{display:flex;align-items:center;gap:.65rem;font-size:.85rem}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#d7f7f6;color:#009b9a;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.25rem}.metric,.card{background:#fff;border:1px solid #deebeb;border-radius:15px}.metric{border-top:3px solid #8ce4e2;padding:1.25rem;display:grid;gap:.45rem}.metric.green{border-color:#10b9b6}.metric.blue{border-color:#237be7}.metric.red{border-color:#e75959}.metric span{font-size:.83rem;color:#637278}.metric strong{font-size:2rem;letter-spacing:-.05em}.card{padding:1.25rem}.card h2{margin:0}.card p{color:#718087;font-size:.9rem}.toolbar{display:flex;justify-content:space-between;gap:1rem;margin-bottom:1.2rem}.toolbar input{width:min(28rem,100%);border:1px solid #d5e4e5;border-radius:10px;padding:.78rem .9rem}.primary{background:#10b9b6;color:#fff;border:0;border-radius:10px;padding:.76rem 1rem;font-weight:800;cursor:pointer}.primary:hover{background:#079d9a}table{border-collapse:collapse;width:100%;font-size:.87rem}th{text-align:left;color:#647378;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:1rem .6rem;border-bottom:1px solid #e6eeee}td{padding:1rem .6rem;border-bottom:1px solid #eff5f5}.pill{font-size:.68rem;font-weight:800;padding:.35rem .5rem;border-radius:99px}.active-pill{background:#dcf8f7;color:#008b89}.pending{background:#e7f0ff;color:#237be7}.problem{background:#fbe5e2;color:#a94236}.empty{padding:4rem 2rem;text-align:center;border:1px dashed #b7dedd;border-radius:16px;background:#fff}.empty span{color:#079d9a;font-size:.8rem;font-weight:800;letter-spacing:.1em}.form{max-width:880px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.form label{display:grid;gap:.45rem;color:#36444a;font-size:.85rem;font-weight:700}.form input,.form select{border:1px solid #d5e4e5;border-radius:10px;background:#fff;padding:.78rem .9rem}.form .full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:.7rem;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid #e5eeee}.secondary{border:0;border-radius:10px;padding:.76rem 1rem;font-weight:700;background:#edf3f3}@media(max-width:850px){.app{grid-template-columns:1fr}aside{height:auto;padding:.8rem;flex-direction:row;align-items:center}.brand{padding:0;margin-right:auto}.side-bottom{display:none}nav{display:flex}.sub{display:none}.content{padding:1.25rem}.grid{grid-template-columns:1fr 1fr}}@media(max-width:540px){.grid,.form-grid{grid-template-columns:1fr}.toolbar{flex-direction:column}.toolbar input{width:100%}.form .full{grid-column:auto}nav button:not(.active){display:none}}</style></head><body><div class="app"><aside><div class="brand"><b>M</b> MOVIDOS TRANSPORTES</div><nav><button data-page="home" class="active">Visão geral</button><button data-page="cadastros">Cadastros</button><div class="sub"><button data-page="cadastros">Ver cadastros</button><button data-page="novo">+ Novo cadastro</button></div><button data-page="financeiro">Financeiro</button><button data-page="extravios">Extravios</button><button data-page="documentos">Documentos</button></nav><div class="side-bottom">Demonstração local<br>Dados não são gravados</div></aside><main class="content"><header><div><p class="eyebrow">MOVIDOS TRANSPORTES · OPERAÇÃO</p><h1 id="title">Visão geral</h1></div><div class="user"><span class="avatar">D</span><div><strong>Demonstração local</strong><br><small>administrador</small></div></div></header><div id="view"></div></main></div><script>const data=[['DID 2','IMILE DELIVERY BRAZIL LTDA','KESLEY','DIADEMA / SP','ATIVO','active-pill'],['VLC 2','IMILE DELIVERY BRAZIL LTDA','EDUARDO','SÃO PAULO / SP','ATIVO','active-pill'],['SCS 5','IMILE DELIVERY BRAZIL LTDA','GABRIEL','SÃO CAETANO / SP','AG. ASSINATURA','pending'],['VNC','IMILE DELIVERY BRAZIL LTDA','NATY','SÃO PAULO / SP','PROBLEMA','problem']];const view=document.querySelector('#view'),title=document.querySelector('#title');const table=()=>`<table><thead><tr><th>Drop</th><th>Parceiro</th><th>Responsável</th><th>Localidade</th><th>Status</th><th></th></tr></thead><tbody>${data.map(d=>`<tr><td><strong>${d[0]}</strong></td><td>${d[1]}</td><td>${d[2]}</td><td>${d[3]}</td><td><span class="pill ${d[5]}">${d[4]}</span></td><td><button class="secondary">Editar</button></td></tr>`).join('')}</tbody></table>`;const pages={home:()=>`<section class="grid"><article class="metric"><span>Drops cadastrados</span><strong>1.102</strong></article><article class="metric green"><span>Operações ativas</span><strong>742</strong></article><article class="metric blue"><span>Em andamento</span><strong>316</strong></article><article class="metric red"><span>Necessitam atenção</span><strong>44</strong></article></section><section class="card"><h2>Atividade recente</h2><p>Prévia baseada na estrutura atual.</p>${table()}</section>`,cadastros:()=>`<section class="toolbar"><input placeholder="Buscar por drop, parceiro ou cidade"><button class="primary" data-page="novo">+ Novo cadastro</button></section><section class="card"><h2>Cadastros de Drops</h2><p>Consulte, filtre e edite os pontos de coleta.</p>${table()}</section>`,novo:()=>`<section class="card form"><p class="eyebrow">CADASTRO DE DROP</p><h2>Novo cadastro</h2><p>Preencha os dados essenciais do ponto de coleta.</p><div class="form-grid"><label>Nome do drop<input></label><label>Parceiro<input></label><label>Responsável<input></label><label>Status<select><option>INTERESSADO</option><option>ATIVO</option><option>AG. ASSINATURA</option></select></label><label>Telefone<input></label><label>E-mail<input type="email"></label><label>Cidade<input></label><label>UF<input maxlength="2"></label><label class="full">Endereço<input></label></div><div class="form-actions"><button class="secondary" data-page="cadastros">Cancelar</button><button class="primary">Salvar cadastro</button></div></section>`,financeiro:()=>`<section class="empty"><span>PRÓXIMA ETAPA</span><h2>Financeiro</h2><p>Períodos, valores, reembolsos e fechamento por drop serão centralizados aqui.</p></section>`,extravios:()=>`<section class="empty"><span>PRÓXIMA ETAPA</span><h2>Extravios</h2><p>Registro, filtros e acompanhamento de ocorrências financeiras.</p></section>`,documentos:()=>`<section class="empty"><span>PRÓXIMA ETAPA</span><h2>Documentos</h2><p>Anexos, contratos e distratos organizados por cadastro.</p></section>`};function show(page){title.textContent=page==='home'?'Visão geral':page==='novo'?'Novo cadastro':page[0].toUpperCase()+page.slice(1);view.innerHTML=pages[page]();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));document.querySelectorAll('nav>button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='novo'&&b.dataset.page==='cadastros')))}show('home');</script></body></html>
